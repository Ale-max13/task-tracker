<!DOCTYPE html>
<!-- Сообщаем браузеру, что это современный HTML-документ -->

<!-- lang="ru" — язык страницы русский -->
<html lang="ru">

<!-- head — служебная часть: настройки страницы, на экране не видна -->
<head>
  <!-- Кодировка UTF-8, чтобы русские буквы отображались правильно -->
  <meta charset="UTF-8">

  <!-- Чтобы страница нормально выглядела на телефоне -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Название вкладки в браузере -->
  <title>Мои задачи</title>

  <!-- Подключаем шрифт Pacifico из Google Fonts (для заголовка).
       Первые две строки заранее открывают соединение с серверами шрифтов,
       чтобы шрифт загрузился быстрее. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">

  <!-- Подключаем файл со стилями (внешним видом страницы) -->
  <link rel="stylesheet" href="style.css">

  <!-- Скрипт тем подключаем здесь, в head, а не в конце страницы:
       так тема включается до того, как страница нарисуется,
       и при обновлении не будет «вспышки» светлой темы. -->
  <script src="theme.js"></script>
</head>

<!-- body — всё, что видно на странице -->
<body>

  <!-- Переключатель тем: три кнопки в одной «таблетке».
       role="group" и aria-label сообщают программам экранного доступа,
       что это одна группа кнопок «Тема оформления».
       data-theme-choice — какую тему включает кнопка (читает theme.js).
       aria-pressed — нажата ли кнопка; theme.js меняет это значение. -->
  <div class="theme-switcher" role="group" aria-label="Тема оформления">
    <button type="button" data-theme-choice="light" aria-pressed="false">☀️ Светлая</button>
    <button type="button" data-theme-choice="dark" aria-pressed="false">🌙 Тёмная</button>
    <button type="button" data-theme-choice="system" aria-pressed="false">💻 Системная</button>
  </div>

  <!-- main — карточка трекера: в ней лежит всё содержимое.
       class="card" нужен, чтобы оформить карточку в style.css. -->
  <main class="card">

    <!-- Главный заголовок страницы -->
    <h1>Мои задачи</h1>

    <!-- Строка с полем ввода и кнопкой. div — просто «коробка»,
         чтобы в style.css поставить поле и кнопку рядом. -->
    <div class="add-row">
      <!-- Поле, куда пользователь вводит текст новой задачи.
           id нужен, чтобы потом найти это поле из JavaScript.
           placeholder — серая подсказка, пока поле пустое. -->
      <input type="text" id="task-input" placeholder="Что нужно сделать?">

      <!-- Кнопка добавления задачи. Её «оживляет» JavaScript. -->
      <button type="button" id="add-button">Добавить</button>
    </div>

    <!-- Список задач. Пункты (li) добавляются сюда из JavaScript. -->
    <ul id="task-list"></ul>

  </main>

  <!-- Подключаем файл с JavaScript.
       Ставим его в самом конце body, чтобы к моменту запуска скрипта
       все элементы выше (поле, кнопка, список) уже были на странице. -->
  <script src="script.js"></script>

</body>
</html>
