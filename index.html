<!DOCTYPE html>
<!-- Сообщаем браузеру, что это современный HTML-документ -->

<!-- lang="ru" — язык страницы русский -->
<html lang="ru">

<!-- head — служебная часть: настройки страницы, на экране не видна -->
<head>
  <!-- Кодировка UTF-8, чтобы русские буквы отображались правильно -->
  <meta charset="UTF-8">

  <!-- Чтобы страница нормально выглядела на телефоне -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Название вкладки в браузере -->
  <title>Мои задачи</title>

  <!-- Подключаем шрифт Pacifico из Google Fonts (для заголовка).
       Первые две строки заранее открывают соединение с серверами шрифтов,
       чтобы шрифт загрузился быстрее. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">

  <!-- Подключаем файл со стилями (внешним видом страницы) -->
  <link rel="stylesheet" href="style.css">

  <!-- Скрипт тем подключаем здесь, в head, а не в конце страницы:
       так тема включается до того, как страница нарисуется,
       и при обновлении не будет «вспышки» светлой темы. -->
  <script src="theme.js"></script>
</head>

<!-- body — всё, что видно на странице -->
<body>

  <!-- Переключатель тем: три кнопки в одной «таблетке».
       role="group" и aria-label сообщают программам экранного доступа,
       что это одна группа кнопок «Тема оформления».
       data-theme-choice — какую тему включает кнопка (читает theme.js).
       aria-pressed — нажата ли кнопка; theme.js меняет это значение. -->
  <div class="theme-switcher" role="group" aria-label="Тема оформления">
    <button type="button" data-theme-choice="light" aria-pressed="false">☀️ Светлая</button>
    <button type="button" data-theme-choice="dark" aria-pressed="false">🌙 Тёмная</button>
    <button type="button" data-theme-choice="system" aria-pressed="false">💻 Системная</button>
  </div>

  <!-- Сегодняшняя дата над карточкой. Пока абзац пустой:
       текст даты вписывает date.js. -->
  <p id="today-date" class="today-date"></p>

  <!-- main — карточка трекера: в ней лежит всё содержимое.
       class="card" нужен, чтобы оформить карточку в style.css. -->
  <main class="card">

    <!-- Главный заголовок страницы -->
    <h1>Мои задачи</h1>

    <!-- Прогресс: сколько задач выполнено. Строку и полоску заполняет
         script.js. hidden — «спрятан»: пока задач нет, блок не виден,
         script.js убирает hidden, когда появляется первая задача. -->
    <div id="progress" class="progress" hidden>
      <!-- Строка: слева «Прогресс», справа, например, «1 из 3 · 33%» -->
      <div class="progress-row">
        <span>Прогресс</span>
        <span id="progress-text"></span>
      </div>
      <!-- Полоска: track — фон («дорожка»), fill — заполненная часть.
           Ширину заполнения задаёт script.js в процентах. -->
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </div>

    <!-- Строка с полем ввода и кнопкой. div — просто «коробка»,
         чтобы в style.css поставить поле и кнопку рядом. -->
    <div class="add-row">
      <!-- Поле, куда пользователь вводит текст новой задачи.
           id нужен, чтобы потом найти это поле из JavaScript.
           placeholder — серая подсказка, пока поле пустое. -->
      <input type="text" id="task-input" placeholder="Что нужно сделать?">

      <!-- Кнопка добавления задачи. Её «оживляет» JavaScript. -->
      <button type="button" id="add-button">Добавить</button>
    </div>

    <!-- Список задач. Пункты (li) добавляются сюда из JavaScript. -->
    <!-- Важно: между <ul> и </ul> не должно быть пробелов и переносов строк,
         иначе пустое состояние ниже не покажется (см. style.css, :empty). -->
    <ul id="task-list"></ul>

    <!-- Пустое состояние: картинка и подсказка, когда задач нет.
         Показывать или прятать его решает style.css: блок виден,
         только пока список задач выше пустой. -->
    <div class="empty-state">

      <!-- Картинка, нарисованная прямо в коде (SVG).
           viewBox="0 0 72 72" — «холст» 72×72, все координаты ниже — на нём.
           aria-hidden="true" — программы экранного доступа её пропускают:
           смысл и так передаёт текст под картинкой. -->
      <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true">
        <!-- defs — «заготовки», которые используются ниже: градиенты -->
        <defs>
          <!-- Градиент корпуса планшета: от светло-сиреневого к фиолетовому -->
          <linearGradient id="board-gradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#c4b5fd"/>
            <stop offset="1" stop-color="#8b5cf6"/>
          </linearGradient>
          <!-- Градиент зажима: светло-серый сверху, темнее снизу — «металл» -->
          <linearGradient id="clip-gradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f3f4f6"/>
            <stop offset="1" stop-color="#9ca3af"/>
          </linearGradient>
        </defs>

        <!-- Лёгкая тень под планшетом — сплюснутый полупрозрачный овал -->
        <ellipse cx="34" cy="64" rx="20" ry="3" fill="#4c3a78" opacity="0.15"/>

        <!-- Корпус планшета: прямоугольник со скруглёнными углами (rx) -->
        <rect x="14" y="10" width="36" height="50" rx="5" fill="url(#board-gradient)"/>

        <!-- Белый лист бумаги -->
        <rect x="19" y="17" width="26" height="38" rx="2" fill="#ffffff"/>

        <!-- Металлический зажим сверху: широкая нижняя часть и узкая верхняя
             с отверстием -->
        <rect x="22" y="11" width="20" height="5" rx="1.5" fill="url(#clip-gradient)"/>
        <rect x="26" y="6" width="12" height="7" rx="2" fill="url(#clip-gradient)"/>
        <circle cx="32" cy="9" r="1.3" fill="#6b7280"/>

        <!-- Строка 1: пустой чекбокс с лавандовой рамкой и серая «строчка текста» -->
        <rect x="22" y="22" width="5" height="5" rx="1" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.2"/>
        <rect x="30" y="23.5" width="12" height="2" rx="1" fill="#e5e7eb"/>

        <!-- Строка 2: такой же пустой чекбокс -->
        <rect x="22" y="31" width="5" height="5" rx="1" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.2"/>
        <rect x="30" y="32.5" width="10" height="2" rx="1" fill="#e5e7eb"/>

        <!-- Строка 3: отмеченный сиреневый чекбокс с белой галочкой -->
        <rect x="22" y="40" width="5" height="5" rx="1" fill="#818cf8" stroke="#818cf8" stroke-width="1.2"/>
        <path d="M23.2 42.6 L24.3 43.7 L25.9 41.6" fill="none" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="30" y="41.5" width="11" height="2" rx="1" fill="#e5e7eb"/>

        <!-- Карандаш. Сначала рисуем его лёжа (слева направо: ластик,
             металлическое кольцо, жёлтый корпус, деревянный кончик, грифель),
             а transform переносит его вправо вверх и поворачивает наискосок. -->
        <g transform="translate(62 18) rotate(115)">
          <rect x="0" y="-3" width="5" height="6" rx="1.5" fill="#f9a8d4"/>   <!-- розовый ластик -->
          <rect x="5" y="-3" width="3" height="6" fill="#d1d5db"/>             <!-- металлическое кольцо -->
          <rect x="8" y="-3" width="19" height="6" fill="#fcd34d"/>            <!-- жёлтый корпус -->
          <rect x="8" y="-0.5" width="19" height="1" fill="#f59e0b" opacity="0.5"/> <!-- полоска на корпусе -->
          <polygon points="27,-3 33,0 27,3" fill="#fde7c3"/>                  <!-- деревянный кончик -->
          <polygon points="31,-1 33,0 31,1" fill="#374151"/>                  <!-- грифель -->
        </g>

        <!-- Искорки-плюсики -->
        <path d="M8 10 V18 M4 14 H12" stroke="#c4b5fd" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M64 55 V61 M61 58 H67" stroke="#f9a8d4" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M67 32 V36 M65 34 H69" stroke="#a5b4fc" stroke-width="1.3" stroke-linecap="round"/>

        <!-- Точки -->
        <circle cx="6" cy="40" r="1.5" fill="#f9a8d4"/>
        <circle cx="66" cy="8" r="1.5" fill="#a5b4fc"/>
      </svg>

      <p class="empty-title">Задач пока нет</p>
      <p class="empty-hint">Добавь первую и начни свой день!</p>
    </div>

    <!-- Плашка «Выполнено!» под списком. Видна, только когда отмечены
         все задачи: hidden убирает и ставит script.js. -->
    <!-- Эмодзи в отдельном span, чтобы в style.css сделать его крупнее текста -->
    <p id="done-badge" class="done-badge" hidden><span class="done-emoji">🎉</span> Выполнено!</p>

  </main>

  <!-- Подключаем файл с JavaScript.
       Ставим его в самом конце body, чтобы к моменту запуска скрипта
       все элементы выше (поле, кнопка, список) уже были на странице. -->
  <script src="script.js"></script>

  <!-- Скрипт, который показывает сегодняшнюю дату над карточкой -->
  <script src="date.js"></script>

</body>
</html>
